name: PFS - Application CI Pipeline

on:
  push:
    branches:
      - ibtihal
    paths:
      - 'app/test-p2/**'
      - '.github/workflows/app-pipeline.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pfs-test-p2:latest ./app/test-p2

      - name: Verify Docker image
        run: |
          docker image inspect pfs-test-p2:latest
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: pfs-test-p2:latest
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
