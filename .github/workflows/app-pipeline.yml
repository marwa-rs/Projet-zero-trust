name: PFS - Application CI Pipeline

on:
  push:
    branches:
      - ibtihal
    paths:
      - 'app/test-p2/**'
      - '.github/workflows/app-pipeline.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 119033255812.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: pfs-test-p2
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pfs-test-p2:latest ./app/test-p2

      - name: Verify Docker image
        run: |
          docker image inspect pfs-test-p2:latest
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: pfs-test-p2:latest
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Scan SBOM with Grype
        run: |
          test -s sbom.spdx.json

          docker run --rm \
            -v "$PWD:/workspace:ro" \
            anchore/grype:latest \
            sbom:/workspace/sbom.spdx.json \
            --output table \
            --fail-on critical

      - name: Configure AWS credentials
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amozon ECR
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image to ECR
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag pfs-test-p2:latest "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Install Cosign
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image with Cosign
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        run: |
          cosign sign --yes "$IMAGE_URI"

      - name: Verify Docker image signature
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/marwa-rs/Projet-zero-trust/.github/workflows/app-pipeline.yml@refs/heads/ibtihal" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_URI"

      - name: Attest SBOM with Cosign
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$IMAGE_URI"

      - name: Verify SBOM attestation
        if: ${{ vars.ENABLE_AWS_ECR == 'true' }}
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "https://github.com/marwa-rs/Projet-zero-trust/.github/workflows/app-pipeline.yml@refs/heads/ibtihal" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_URI"
